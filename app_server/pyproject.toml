[project]
name = "python-mcp-app-server"
version = "0.1.0"
description = "Starter for an MCP server called by your own programs (tools + REST routes)"
readme = "README.md"
authors = [
    { name = "김현호" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.2.0",
    "rich>=15.0.0",
]

[project.optional-dependencies]
gunicorn = [
    "gunicorn>=23.0.0",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
